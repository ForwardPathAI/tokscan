name: release

# Push a tag like v0.2.0 to publish binaries + installers as a GitHub release.
# Run manually (workflow_dispatch) to build and smoke-test without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # One Linux box builds every target. Bun ad-hoc signs the macOS binaries
    # when cross-compiling, which Apple Silicon requires.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

      - name: Build all targets
        env:
          TOKSCAN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-ci.{0}', github.run_number) }}
          # PostHog project API key (write-only, safe to embed). Settings > Secrets and variables > Variables.
          TOKSCAN_POSTHOG_KEY: ${{ vars.TOKSCAN_POSTHOG_KEY }}
        run: bun run scripts/build.ts

      - name: Checksums and installers
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist && sha256sum tokscan-* install.sh install.ps1 > checksums.txt && cat checksums.txt

      - name: Smoke test (linux-x64)
        run: |
          ./dist/tokscan-linux-x64 version
          ./dist/tokscan-linux-x64 report --days 1
          file dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
